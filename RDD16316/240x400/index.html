<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="ad.size" content="width=240,height=400" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://fonts.cdnfonts.com/css/proxima-nova-condensed"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }

      div {
        font-family: "Proxima Nova Condensed";
        color: #fff;
      }

      .container {
        border: 1px solid #000;
        position: relative;
        background-color: #d6001c;
        width: 240px;
        height: 400px;
        box-sizing: border-box;
      }

      @keyframes scaleUp {
        from {
          transform: scale(0);
        }

        to {
          transform: scale(1);
        }
      }

      @keyframes showBox {
        from {
          opacity: 0;
          transform: translateY(25px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes moveToLeft {
        from {
          top: calc(50% - (50px / 2));
          left: calc(50% - (145px / 2));
        }

        to {
          top: 35px;
          left: 30px;
        }
      }

      @keyframes dummyAnimation {
        0%,
        to {
          opacity: 0;
        }
      }

      #logo {
        width: 50px;
        transform: scale(0);
      }

      #x {
        width: 12px;
        transform: scale(0);
      }

      #logoHH {
        width: 50px;
        transform: scale(0);
      }

      #logoContainer {
        position: absolute;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        justify-items: center;
        align-items: center;

        top: calc(50% - (50px/ 2));
        left: calc(50% - (145px/ 2));
      }

      #text {
        position: absolute;
        display: grid;
        grid-template-rows: 1fr 1fr;

        left: 30px;
        top: 140px;
      }

      #text > div {
        font-size: 31px;
        line-height: 31px;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-align: left;
      }

      .subtext {
        font-size: 15px !important;
        font-weight: 600 !important;
        line-height: 18px !important;
      }

      #age,
      #disclaimer {
        font-weight: 400;
        letter-spacing: 0.01em;
        text-align: left;
      }

      #age {
        position: absolute;
        left: 205px;
        top: 363px;

        font-size: 13px;
        font-weight: 400;
        text-align: right;
      }

      #disclaimer {
        position: absolute;

        font-size: 8px;
        font-weight: 400;
        line-height: 8px;
        text-align: left;

        left: 30px;
        top: 331px;
        width: 189px;
      }

      #logo {
        animation: scaleUp 0.5s ease-in-out forwards,
          0.5s scaleUp 9s ease-in-out forwards reverse;
      }

      #x {
        animation: 0.5s scaleUp 0.1s ease-in-out forwards,
          0.5s scaleUp 8.9s ease-in-out forwards reverse;
      }

      #logoHH {
        animation: 0.5s scaleUp 0.2s ease-in-out forwards,
          0.5s scaleUp 8.8s ease-in-out forwards reverse;
      }

      #logoContainer {
        animation: 0.7s moveToLeft 1s ease-in-out forwards,
          0.7s moveToLeft 8.2s ease-in-out forwards reverse;
      }

      #text > div:nth-child(1) {
        opacity: 0;
        transform: translateY(25px);
        animation: 0.5s showBox 1.5s ease-in-out forwards,
          0.5s showBox 7.4s ease-in-out forwards reverse;
      }

      #text > div:nth-child(2) {
        opacity: 0;
        transform: translateY(25px);
        animation: 0.5s showBox 1.6s ease-in-out forwards,
          0.5s showBox 7.3s ease-in-out forwards reverse;
      }

      #text > div:nth-child(3) {
        opacity: 0;
        transform: translateY(25px);
        animation: 0.5s showBox 1.7s ease-in-out forwards,
          0.5s showBox 7.2s ease-in-out forwards reverse;
      }
      #text> div:nth-child(4) {
        opacity: 0;
        transform: translateY(25px);
        animation: 0.5s showBox 1.8s ease-in-out forwards,
          0.5s showBox 7.1s ease-in-out forwards reverse;
        margin-top: 13px;
      }
      #text> div:nth-child(5) {
        opacity: 0;
        transform: translateY(25px);
        animation: 0.5s showBox 1.9s ease-in-out forwards,
          0.5s showBox 7s ease-in-out forwards reverse;
      }

      #dummy {
        animation: dummyAnimation 9s ease forwards;
      }
    </style>
  </head>

      </div>
      <div class="content">
        <div id="text">
          <div id="text1">ищи вакансии</div>
          <div id="text2">в кол-центре</div>
          <div id="text3">МТС на hh.ru</div>
          <div id="text4" class="subtext">все условия для роста</div>
          <div id="text5" class="subtext">и стабильного дохода</div>
        </div>
        <div id="disclaimer">
          ООО &laquo;Хэдхантер&raquo; не&nbsp;гарантирует наличие подходящих
          вакансий во&nbsp;всех населённых пунктах РФ. Полная
          информация&nbsp;&mdash; на&nbsp;hh.ru ООО &laquo;Хэдхантер&raquo;,
          ОГРН 1067761906805, г.Москва
        </div>
      </div>

      <div id="age">0+</div>
      <div id="dummy"></div>
    </div>
    <script>
      function restartAnimations() {
        let elements = [
            "logo",
            "x",
            "logoHH",
            "logoContainer",
            "text1", // for #text > div:nth-child(1)
            "text2", // for #text > div:nth-child(2)
            "text3", // for #text > div:nth-child(3)
            "text4",
            "text5",
            "dummy",
          ],
          animations = {
            logo: "scaleUp 0.5s ease-in-out forwards, 0.5s scaleUp 9s ease-in-out forwards reverse",
            x: "0.5s scaleUp 0.1s ease-in-out forwards, 0.5s scaleUp 8.9s ease-in-out forwards reverse",
            logoHH:
              "0.5s scaleUp 0.2s ease-in-out forwards, 0.5s scaleUp 8.8s ease-in-out forwards reverse",
            logoContainer:
              "0.7s moveToLeft 1s ease-in-out forwards, 0.7s moveToLeft 8.2s ease-in-out forwards reverse",
            text1: "0.5s showBox 1.5s ease-in-out forwards, 0.5s showBox 7.4s ease-in-out forwards reverse",
            text2: "0.5s showBox 1.6s ease-in-out forwards, 0.5s showBox 7.3s ease-in-out forwards reverse",
            text3: "0.5s showBox 1.7s ease-in-out forwards, 0.5s showBox 7.2s ease-in-out forwards reverse",
            text4: "0.5s showBox 1.8s ease-in-out forwards, 0.5s showBox 7.1s ease-in-out forwards reverse",
            text5: "0.5s showBox 1.9s ease-in-out forwards, 0.5s showBox 7s ease-in-out forwards reverse",
            dummy: "dummyAnimation 9s ease forwards",
          };

        setTimeout(function () {
          elements.forEach((e) => {
            document.getElementById(e).style.animation = "none";
          }),
            document.body.offsetWidth,
            elements.forEach((e) => {
              document.getElementById(e).style.animation = animations[e];
            });
        }, 1500);
      }

      document
        .getElementById("dummy")
        .addEventListener("animationend", restartAnimations);
    </script>
  </body>
</html>
